<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<title>Five Night's At 9A - Gamepad | dextomoser</title>
<style>
  :root { --red:#d41414; --red-d:#5a0909; --bg:#060606; --panel:#0e0e0f; --txt:#d9d9d9; --dim:#7b7b7b; --ok:#46d36a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--txt);
    font-family: "Courier New", Courier, monospace; touch-action: manipulation; overscroll-behavior: none; }
  body { background:
      radial-gradient(ellipse at 50% 0%, rgba(120,0,0,.28), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px), var(--bg);
    padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { text-align: center; padding: 6px 0 12px; }
  h1 { margin: 0; font-size: clamp(30px, 9.5vw, 46px); line-height: 1.05; letter-spacing: .04em; color: #e11616;
    text-shadow: 0 0 12px rgba(255,0,0,.6), 0 0 34px rgba(120,0,0,.9); animation: flick 6s infinite; }
  .dev { margin-top: 6px; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
  .dev b { color: #cfcfcf; }
  #conn { display: inline-block; margin-top: 10px; padding: 4px 12px; font-size: 12px; letter-spacing: .14em; border: 1px solid #333; color: var(--dim); }
  #conn.ok { color: var(--ok); border-color: #1f5a2d; }
  #conn.bad { color: #ff4a4a; border-color: var(--red-d); }

  section { margin-top: 14px; padding: 10px; background: var(--panel); border: 1px solid #231010; box-shadow: inset 0 0 30px rgba(0,0,0,.8); }
  h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .25em; color: #8d2a2a; font-weight: normal; text-transform: uppercase; }
  .row { display: grid; gap: 8px; }
  .r2 { grid-template-columns: 1fr 1fr; }
  .r3 { grid-template-columns: 1fr 1fr 1fr; }
  .r4 { grid-template-columns: repeat(4, 1fr); }

  button.btn { font-family: inherit; color: var(--txt); background: linear-gradient(#1a1a1b, #0b0b0c); border: 1px solid #3a1515;
    padding: 0 6px; min-height: 64px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 2px 0 #000, inset 0 0 14px rgba(0,0,0,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  button.btn small { font-size: 10px; color: var(--dim); letter-spacing: .1em; }
  button.btn:active, button.btn.on { background: linear-gradient(#4a0707, #1d0303); border-color: var(--red); color: #fff;
    box-shadow: 0 0 18px rgba(220,0,0,.55), inset 0 0 14px rgba(0,0,0,.6); }
  button.tall { min-height: 92px; font-size: 18px; }
  button.cam { min-height: 54px; font-size: 14px; }
  button.big { min-height: 84px; font-size: 20px; border-color: #7a0a0a; }
  button.chip { min-height: 38px; font-size: 11px; }

  #pad { height: 170px; border: 1px dashed #4a1515; background: radial-gradient(circle at 50% 50%, #130808, #070707);
    display: flex; align-items: center; justify-content: center; text-align: center; color: var(--dim); font-size: 12px; letter-spacing: .1em;
    touch-action: none; }
  details > summary { cursor: pointer; font-size: 12px; letter-spacing: .25em; color: #8d2a2a; text-transform: uppercase; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] > summary { margin-bottom: 8px; }

  #overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center;
    background: rgba(0,0,0,.92); }
  #overlay.show { display: flex; }
  #overlay .box { border: 1px solid var(--red-d); padding: 22px; max-width: 420px; background: #0a0a0a; box-shadow: 0 0 40px rgba(180,0,0,.35); }
  #overlay h3 { margin: 0 0 10px; color: #ff3b3b; letter-spacing: .12em; }
  #overlay p { margin: 0 0 14px; color: #bbb; line-height: 1.5; }
  footer { margin-top: 16px; text-align: center; font-size: 11px; letter-spacing: .15em; color: #4d4d4d; }

  @keyframes flick { 0%,90%,100% { opacity: 1; } 91% { opacity: .5; } 92% { opacity: 1; } 95% { opacity: .35; } 96% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Five Night's At 9A</h1>
    <div class="dev">Developer: <b>dextomoser</b></div>
    <div id="conn">BAĞLANIYOR...</div>
  </header>

  <section>
    <h2>Ofiste Bak</h2>
    <div class="row r3">
      <button class="btn" data-cmd="ofis_sol" data-act="tap">◀ Sol</button>
      <button class="btn" data-cmd="ofis_merkez" data-act="tap">Orta</button>
      <button class="btn" data-cmd="ofis_sag" data-act="tap">Sağ ▶</button>
    </div>
  </section>

  <section>
    <h2>Kapılar &amp; Işıklar</h2>
    <div class="row r2">
      <button class="btn tall" id="doorL" data-cmd="sol_kapi" data-act="toggle">Sol Kapı<small id="doorLs">AÇ / KAPAT</small></button>
      <button class="btn tall" id="doorR" data-cmd="sag_kapi" data-act="toggle">Sağ Kapı<small id="doorRs">AÇ / KAPAT</small></button>
      <button class="btn tall" id="lightL" data-light="sol_isik">Sol Işık<small>BASILI TUT</small></button>
      <button class="btn tall" id="lightR" data-light="sag_isik">Sağ Işık<small>BASILI TUT</small></button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn chip" id="lightMode" type="button">Işık modu: BASILI TUT (değiştirmek için dokun)</button>
    </div>
  </section>

  <section>
    <h2>Kamera</h2>
    <div class="row">
      <button class="btn big" data-cmd="kamera_toggle" data-act="toggle">Kamera Panelini Aç / Kapat</button>
    </div>
    <div class="row r4" style="margin-top:8px">
      <button class="btn cam" data-cmd="cam_1" data-act="tap">CAM 1A</button>
      <button class="btn cam" data-cmd="cam_2" data-act="tap">CAM 1B</button>
      <button class="btn cam" data-cmd="cam_3" data-act="tap">CAM 1C</button>
      <button class="btn cam" data-cmd="cam_9" data-act="tap">CAM 5</button>
      <button class="btn cam" data-cmd="cam_4" data-act="tap">CAM 2A</button>
      <button class="btn cam" data-cmd="cam_5" data-act="tap">CAM 2B</button>
      <button class="btn cam" data-cmd="cam_6" data-act="tap">CAM 3</button>
      <button class="btn cam" data-cmd="cam_10" data-act="tap">CAM 6</button>
      <button class="btn cam" data-cmd="cam_7" data-act="tap">CAM 4A</button>
      <button class="btn cam" data-cmd="cam_8" data-act="tap">CAM 4B</button>
      <button class="btn cam" data-cmd="cam_11" data-act="tap">CAM 7</button>
    </div>
  </section>

  <section>
    <details>
      <summary>▸ Menü &amp; Touchpad</summary>
      <div class="row r2">
        <button class="btn" data-cmd="menu_yeni" data-act="tap">Yeni Oyun</button>
        <button class="btn" data-cmd="menu_devam" data-act="tap">Devam</button>
      </div>
      <div id="pad" style="margin-top:8px">PARMAĞINI SÜRÜKLE = İMLEÇ<br>DOKUN = TIKLA</div>
    </details>
  </section>

  <footer>Five Night's At 9A &mdash; Developer: dextomoser</footer>
</div>

<div id="overlay"><div class="box"><h3 id="ovTitle">Bağlantı</h3><p id="ovText"></p><button class="btn chip" id="ovBtn" type="button">Yeniden dene</button></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var gameId = (qs.get('game') || '').toUpperCase();
  var token = qs.get('token') || '';
  var joined = false;
  var lightHold = true;                 // true: basılı tut, false: aç/kapat
  var heldLights = {};

  var socket = io({ transports: ['websocket', 'polling'] });

  function setConn(text, cls) { var c = $('conn'); c.textContent = text; c.className = cls || ''; }
  function showOverlay(title, text, btn) {
    $('ovTitle').textContent = title; $('ovText').textContent = text;
    $('ovBtn').style.display = btn ? '' : 'none';
    $('overlay').classList.add('show');
  }
  function hideOverlay() { $('overlay').classList.remove('show'); }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms || 15); }

  function send(type, action) {
    if (!joined) return;
    socket.emit('cmd', { type: type, action: action || 'tap' });
  }

  function join() {
    if (!gameId || !token) {
      showOverlay('QR gerekli', 'Bu sayfa tahtadaki QR kod okutularak açılmalıdır.', false);
      setConn('QR KODU OKUTUN', 'bad');
      return;
    }
    socket.emit('controller:join', { gameId: gameId, token: token }, function (res) {
      if (res && res.ok) { joined = true; setConn('BAĞLI • ODA ' + gameId, 'ok'); hideOverlay(); buzz(40); }
      else { joined = false; setConn('BAĞLANAMADI', 'bad'); showOverlay('Eşleşme başarısız', (res && res.error) || 'Bilinmeyen hata.', true); }
    });
  }

  socket.on('connect', join);
  socket.on('disconnect', function () { joined = false; setConn('BAĞLANTI KOPTU...', 'bad'); });
  socket.on('host:disconnected', function () { joined = false; setConn('TAHTA YOK', 'bad'); showOverlay('Tahta bağlantısı koptu', 'Tahta yeniden bağlanınca otomatik devam edebilirsiniz; olmazsa QR kodu yeniden okutun.', true); });
  socket.on('room:replaced', function () { joined = false; setConn('BAŞKA KUMANDA BAĞLANDI', 'bad'); showOverlay('Kumanda değişti', 'Bu oyuna başka bir telefon bağlandı.', true); });
  socket.on('room:closed', function () { joined = false; setConn('ODA KAPANDI', 'bad'); showOverlay('Oda kapandı', 'Tahtadaki QR kodu yeniden okutun.', false); });
  $('ovBtn').addEventListener('click', function () { hideOverlay(); join(); });

  /* ---- Normal butonlar (tek dokunuş) ---- */
  document.querySelectorAll('[data-cmd]').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      b.classList.add('on'); buzz(15);
      send(b.dataset.cmd, b.dataset.act);
      if (b.id === 'doorL' || b.id === 'doorR') {
        var s = $(b.id + 's'); s.textContent = s.textContent === 'KAPALI' ? 'AÇIK' : 'KAPALI';
      }
    });
    var off = function () { b.classList.remove('on'); };
    b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });

  /* ---- Işık butonları (basılı tut veya aç/kapat) ---- */
  document.querySelectorAll('[data-light]').forEach(function (b) {
    var cmd = b.dataset.light;
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (x) {}
      buzz(15);
      if (lightHold) { heldLights[cmd] = true; b.classList.add('on'); send(cmd, 'down'); }
      else { b.classList.toggle('on'); send(cmd, 'toggle'); }
    });
    var up = function () {
      if (lightHold && heldLights[cmd]) { heldLights[cmd] = false; b.classList.remove('on'); send(cmd, 'up'); }
    };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  });

  function releaseLights() {
    Object.keys(heldLights).forEach(function (k) { if (heldLights[k]) { heldLights[k] = false; send(k, 'up'); } });
    document.querySelectorAll('[data-light]').forEach(function (b) { if (lightHold) b.classList.remove('on'); });
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseLights(); });
  window.addEventListener('blur', releaseLights);

  $('lightMode').addEventListener('click', function () {
    releaseLights();
    lightHold = !lightHold;
    document.querySelectorAll('[data-light]').forEach(function (b) { b.classList.remove('on'); b.querySelector('small').textContent = lightHold ? 'BASILI TUT' : 'AÇ / KAPAT'; });
    this.textContent = 'Işık modu: ' + (lightHold ? 'BASILI TUT' : 'AÇ / KAPAT') + ' (değiştirmek için dokun)';
  });

  /* ---- Touchpad (sanal imleç) ---- */
  (function () {
    var pad = $('pad'), last = null, startT = 0, moved = 0, accX = 0, accY = 0, raf = 0;
    var GAIN = 1.6;
    function flush() {
      raf = 0;
      if (!accX && !accY) return;
      if (joined) socket.emit('cmd', { type: 'imlec_hareket', dx: accX, dy: accY });
      accX = 0; accY = 0;
    }
    pad.addEventListener('pointerdown', function (e) {
      e.preventDefault(); pad.setPointerCapture(e.pointerId);
      last = { x: e.clientX, y: e.clientY }; startT = Date.now(); moved = 0;
    });
    pad.addEventListener('pointermove', function (e) {
      if (!last) return;
      var w = pad.clientWidth || 300;
      var dx = (e.clientX - last.x) / w * 1280 * GAIN, dy = (e.clientY - last.y) / w * 1280 * GAIN;
      moved += Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y);
      last = { x: e.clientX, y: e.clientY };
      accX += dx; accY += dy;
      if (!raf) raf = requestAnimationFrame(flush);
    });
    var end = function () {
      if (last && moved < 10 && Date.now() - startT < 300) { buzz(15); send('imlec_tik', 'tap'); }
      last = null;
    };
    pad.addEventListener('pointerup', end);
    pad.addEventListener('pointercancel', function () { last = null; });
  })();

  /* ---- Ekran kapanmasın ---- */
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
